[defaults]
collections_path = ./collections:/usr/share/ansible/collections:~/.ansible/collections
roles_path = ./roles:/usr/share/ansible/roles:~/.ansible/roles
# Rocky 10 ships Python 3.12 as the system interpreter. Pinning it silences the
# interpreter-discovery warning and keeps a later extra Python from changing
# which one Ansible uses on the managed host.
interpreter_python = /usr/bin/python3.12
