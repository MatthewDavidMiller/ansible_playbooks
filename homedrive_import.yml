---
# One-shot bulk load of the Nextcloud files tree into a homedrive drive, then
# the checks the migration needs before any cutover. Run it from
# playbook-runner after vm1.yml has deployed homedrive; it is not part of
# update_homelab_vms.yml. It needs homedrive 0.1.4 or later.
#
# A run with no tags is quick: it reads only the files the drive lacks.
#
# 1. verify-tree --quick: every source path, by size, without reading the
#    files. If more than homedrive_import_max_missing are missing, it stops
#    before writing anything; that means the wrong user or source, or a
#    drive the sync client has not filled. Raise the limit only once the
#    list makes sense.
# 2. import-tree --only-missing: every file the drive lacks becomes a new
#    file there. Paths the drive already has are left alone, unread: a sync
#    client uploaded them, so import-tree would never replace them anyway.
#    Old versions are not imported.
# 3. verify-tree --quick again, which must be clean.
#
# The tag "full" (a template of its own, with a long timeout) runs only the
# slow checks the source must pass before it is retired: verify-tree reads
# every source file and compares it byte for byte, fsck --deep reads every
# version back, and gc --dry-run shows what collection would free without
# freeing it. Hashes are kept in homedrive_import_cache_dir, so a later run,
# or one that was cut off, reads only files that changed since; set
# homedrive_import_fresh to read everything afresh.
#
# Reviewed differences: a full check can find differences that have been looked
# into and are harmless. List them in homedrive_import_accepted (in the
# inventory, never in this repository: it names files) as lines of
# "<sha256>  <path>", the path under the source and the SHA-256 of the source
# content that was reviewed. Such a missing or different file is accepted only
# while its source still has exactly that content, so a change after the review
# is reported again. The list is written to a root-only file in the cache
# folder for the check to read, and is never printed. It needs homedrive 0.1.8.
#
# Everything runs in a one-off container from the running server's image,
# with no network, through the server's admin socket. The source is mounted
# read-only and the store read-only (the socket needs no write), with SELinux
# separation off for this container only, so neither tree is relabeled: a :Z
# here would take the store away from the running server. It reads the
# Nextcloud files through their group, which Nextcloud's permissions give
# read access. Re-running is safe. Full output goes to homedrive_import_log;
# the run log shows the summaries.
- name: Import the Nextcloud files tree into homedrive
  hosts: vm1
  gather_facts: false
  tasks:
    # Defaults only. Play vars would beat the inventory, so these are set as
    # facts, each keeping the inventory's value when there is one.
    - name: Apply the defaults for what the inventory leaves unset
      ansible.builtin.set_fact:
        homedrive_import_user: "{{ homedrive_import_user | default(nextcloud_homelab_user | default('')) }}"
        homedrive_import_src: >-
          {{ homedrive_import_src | default((nextcloud_path | default('/data_drive/nextcloud'))
             ~ '/data/' ~ (nextcloud_homelab_user | default('')) ~ '/files') }}
        homedrive_import_dest: "{{ homedrive_import_dest | default('') }}"
        homedrive_import_max_missing: "{{ homedrive_import_max_missing | default(100) }}"
        homedrive_import_source_gid: "{{ homedrive_import_source_gid | default(nextcloud_gid | default('33')) }}"
        homedrive_import_log: "{{ homedrive_import_log | default('/var/log/homedrive_import.log') }}"
        homedrive_import_cache_dir: "{{ homedrive_import_cache_dir | default('/var/lib/homedrive_import') }}"
        homedrive_import_fresh: "{{ homedrive_import_fresh | default(false) }}"
        homedrive_import_accepted: "{{ homedrive_import_accepted | default('') }}"
        homedrive_import_timeout_s: "{{ homedrive_import_timeout_s | default(86400) }}"
        homedrive_import_store: "{{ homedrive_import_store | default(homedrive_path | default('/data_drive/homedrive/store')) }}"
        homedrive_import_uid: "{{ homedrive_import_uid | default(homedrive_uid | default('10001')) }}"
        homedrive_import_gid: "{{ homedrive_import_gid | default(homedrive_gid | default('10001')) }}"
      no_log: true
      tags: [always]

    - name: Validate import inputs
      ansible.builtin.assert:
        that:
          - homedrive_import_user is match('^[A-Za-z0-9._-]{1,64}$')
          - homedrive_import_user in (homedrive_users | default([]) | map(attribute='name') | list)
          - homedrive_import_src | homelab_safe_absolute_path
          - homedrive_import_store | homelab_safe_absolute_path
          - homedrive_import_log | homelab_safe_absolute_path
          - homedrive_import_cache_dir | homelab_safe_absolute_path
          - (homedrive_import_cache_dir ~ '/').find(homedrive_import_src ~ '/') != 0
          - (homedrive_import_cache_dir ~ '/').find(homedrive_import_store ~ '/') != 0
          - (homedrive_import_src ~ '/').find(homedrive_import_cache_dir ~ '/') != 0
          - (homedrive_import_store ~ '/').find(homedrive_import_cache_dir ~ '/') != 0
          - homedrive_import_max_missing | int >= 0
          - >-
            homedrive_import_accepted | trim == ''
            or (homedrive_import_accepted | trim).splitlines()
               | reject('match', '^\\\\?[0-9a-f]{64}  .+$') | reject('match', '^\\s*$') | list | length == 0
          - homedrive_import_source_gid | string is match('^[0-9]+$')
        fail_msg: >-
          homedrive_import_user must be one of homedrive_users; the source,
          store, cache and log must be absolute paths, the cache must be
          neither inside nor around the source or the store, and every line
          of homedrive_import_accepted must be "<sha256>  <path>" (lowercase
          hex, two spaces).
      no_log: true
      tags: [always]

    - name: Read the running homedrive container's image
      ansible.builtin.command:
        argv:
          - podman
          - container
          - inspect
          - --format
          - "{{ '{{' }}.State.Running{{ '}}' }} {{ '{{' }}.Image{{ '}}' }}"
          - homedrive
      register: homedrive_import_container
      changed_when: false
      check_mode: false
      tags: [always]

    - name: Require a running homedrive server
      ansible.builtin.assert:
        that:
          - homedrive_import_container.stdout.split() | length == 2
          - homedrive_import_container.stdout.split()[0] == 'true'
          - homedrive_import_container.stdout.split()[1] is match('^[0-9a-f]{64}$')
        fail_msg: The homedrive container is not running; deploy it with vm1.yml first.
      tags: [always]

    - name: Check the source tree
      ansible.builtin.stat:
        path: "{{ homedrive_import_src }}"
      register: homedrive_import_src_stat
      tags: [always]

    - name: Require the source tree
      ansible.builtin.assert:
        that:
          - homedrive_import_src_stat.stat.isdir | default(false)
          - not (homedrive_import_src_stat.stat.islnk | default(false))
        fail_msg: "{{ homedrive_import_src }} is not a directory."
      tags: [always]

    # Only the container user writes here: the hashes of the source files.
    - name: Create the hash cache directory
      ansible.builtin.file:
        path: "{{ homedrive_import_cache_dir }}"
        state: directory
        owner: "{{ homedrive_import_uid }}"
        group: "{{ homedrive_import_gid }}"
        mode: "0700"
      tags: [always]

    # The list names files, so it is never shown, and a stale one is removed:
    # an empty variable must not leave the last list in force.
    - name: Write the reviewed differences for the check
      ansible.builtin.copy:
        content: "{{ homedrive_import_accepted | trim }}\n"
        dest: "{{ homedrive_import_cache_dir }}/accepted.sha256"
        owner: "{{ homedrive_import_uid }}"
        group: "{{ homedrive_import_gid }}"
        mode: "0400"
      no_log: true
      diff: false
      when: homedrive_import_accepted | trim | length > 0
      tags: [always]

    - name: Remove an earlier list of reviewed differences
      ansible.builtin.file:
        path: "{{ homedrive_import_cache_dir }}/accepted.sha256"
        state: absent
      when: homedrive_import_accepted | trim | length == 0
      tags: [always]

    - name: Set the one-off container command
      ansible.builtin.set_fact:
        homedrive_import_run: >-
          /usr/bin/podman run --rm --pull=never --network=none
          --user {{ homedrive_import_uid }}:{{ homedrive_import_gid }}
          --group-add {{ homedrive_import_source_gid }}
          --security-opt label=disable
          --volume {{ homedrive_import_store | quote }}:/var/lib/homedrive:ro
          --volume {{ homedrive_import_src | quote }}:/mnt/src:ro
          --volume {{ homedrive_import_cache_dir | quote }}:/mnt/cache
          --read-only --cap-drop=ALL --security-opt=no-new-privileges:true
          --memory=1g --memory-swap=1g --pids-limit=50
          {{ homedrive_import_container.stdout.split()[1] }}
        homedrive_import_args: >-
          --user {{ homedrive_import_user | quote }} --src /mnt/src
          {{ ('--dest ' ~ (homedrive_import_dest | quote)) if homedrive_import_dest | length > 0 else '' }}
        homedrive_import_cache: >-
          {{ '' if homedrive_import_fresh | bool else '--hash-cache /mnt/cache/hashes.jsonl' }}
        homedrive_import_accepted_arg: >-
          {{ '--accepted /mnt/cache/accepted.sha256' if homedrive_import_accepted | trim | length > 0 else '' }}
        homedrive_import_summary: 'checked(?: by size only)?: ([0-9]+) missing, ([0-9]+) different, ([0-9]+) skipped'
      tags: [always]

    # A server older than the flag would ignore it and accept nothing: refuse
    # instead of leaving it to look as if the list had been read.
    - name: Check the server reads the reviewed list
      ansible.builtin.command:
        cmd: "{{ homedrive_import_run }} version"
      register: homedrive_import_version
      changed_when: false
      check_mode: false
      when: homedrive_import_accepted | trim | length > 0
      tags: [always]

    - name: Require homedrive 0.1.8 or later for the reviewed list
      ansible.builtin.assert:
        that:
          - (homedrive_import_version.stdout | regex_search('[0-9]+[.][0-9]+[.][0-9]+')) is version('0.1.8', '>=')
        fail_msg: homedrive_import_accepted needs homedrive 0.1.8 or later; run vm1.yml with the newer image first.
      when: homedrive_import_accepted | trim | length > 0
      tags: [always]

    # verify-tree exits 1 whenever anything is missing, which is expected
    # here, so only its summary line decides.
    - name: Find what the drive lacks (read-only, by size)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          out="$(mktemp)"
          {{ homedrive_import_run }} verify-tree --quick {{ homedrive_import_accepted_arg }} {{ homedrive_import_args }} > "$out" 2>&1 || true
          { echo "== $(date -Is) verify-tree --quick before the import"; cat "$out"; } >> {{ homedrive_import_log | quote }}
          grep -E '^(MISSING|DIFFERENT|SKIPPED) ' "$out" | head -n 50 || true
          grep -E '^[0-9]+ file\(s\) checked' "$out" || { tail -n 5 "$out"; rm -f "$out"; exit 1; }
          rm -f "$out"
        executable: /bin/bash
      register: homedrive_import_before
      changed_when: false
      check_mode: false
      async: "{{ homedrive_import_timeout_s }}"
      poll: 15
      tags: [import]

    - name: Read the counts before the import
      ansible.builtin.set_fact:
        homedrive_import_before_counts: >-
          {{ (homedrive_import_before.stdout_lines | last)
             | regex_search(homedrive_import_summary, '\1', '\2', '\3')
             | map('int') | list }}
      tags: [import]

    - name: Show what the drive lacks
      ansible.builtin.debug:
        msg: "{{ homedrive_import_before.stdout_lines }}"
      tags: [import]

    - name: Stop if far more is missing than expected
      ansible.builtin.assert:
        that:
          - homedrive_import_before_counts[0] <= homedrive_import_max_missing | int
        fail_msg: >-
          {{ homedrive_import_before_counts[0] }} files are missing from the drive,
          more than homedrive_import_max_missing ({{ homedrive_import_max_missing }}).
          Nothing was imported. Check the user and source, and that the sync
          client has finished; the full list is in {{ homedrive_import_log }}.
      tags: [import]

    - name: Import the missing files
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          out="$(mktemp)"
          status=0
          {{ homedrive_import_run }} import-tree --only-missing {{ homedrive_import_cache }} {{ homedrive_import_args }} > "$out" 2>&1 || status=$?
          { echo "== $(date -Is) import-tree --only-missing (exit $status)"; cat "$out"; } >> {{ homedrive_import_log | quote }}
          grep -E '^(SKIPPED|CHANGED-HERE) ' "$out" | head -n 50 || true
          grep -E '^imported [0-9]+ file|already in the drive' "$out" || tail -n 5 "$out"
          rm -f "$out"
          exit "$status"
        executable: /bin/bash
      register: homedrive_import_result
      changed_when: homedrive_import_result.stdout is search('^imported [1-9]', multiline=true)
      when: homedrive_import_before_counts[0] > 0
      async: "{{ homedrive_import_timeout_s }}"
      poll: 15
      tags: [import]

    - name: Show the import
      ansible.builtin.debug:
        msg: "{{ homedrive_import_result.stdout_lines | default(['nothing was missing; nothing imported']) }}"
      tags: [import]

    - name: Check nothing is missing now (by size)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          out="$(mktemp)"
          status=0
          {{ homedrive_import_run }} verify-tree --quick {{ homedrive_import_accepted_arg }} {{ homedrive_import_args }} > "$out" 2>&1 || status=$?
          { echo "== $(date -Is) verify-tree --quick after the import (exit $status)"; cat "$out"; } >> {{ homedrive_import_log | quote }}
          grep -E '^(MISSING|DIFFERENT|SKIPPED) ' "$out" | head -n 50 || true
          grep -E '^[0-9]+ file\(s\) checked' "$out" || tail -n 5 "$out"
          rm -f "$out"
          exit "$status"
        executable: /bin/bash
      register: homedrive_import_after
      changed_when: false
      failed_when: false
      check_mode: false
      async: "{{ homedrive_import_timeout_s }}"
      poll: 15
      tags: [import]

    - name: Show the check after the import
      ansible.builtin.debug:
        msg: "{{ homedrive_import_after.stdout_lines }}"
      tags: [import]

    - name: Require every source path in the drive
      ansible.builtin.assert:
        that:
          - homedrive_import_after.rc == 0
        fail_msg: >-
          Something is still missing, a different size, or skipped; see above
          and {{ homedrive_import_log }}. A DIFFERENT file was changed in
          homedrive since; check each one.
      tags: [import]

    - name: Compare every source file byte for byte
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          out="$(mktemp)"
          status=0
          {{ homedrive_import_run }} verify-tree {{ homedrive_import_cache }} {{ homedrive_import_accepted_arg }} {{ homedrive_import_args }} > "$out" 2>&1 || status=$?
          { echo "== $(date -Is) verify-tree (exit $status)"; cat "$out"; } >> {{ homedrive_import_log | quote }}
          grep -E '^(MISSING|DIFFERENT|SKIPPED) ' "$out" | head -n 50 || true
          grep -E '^[0-9]+ file\(s\) checked|hash\(es\) from the cache|^cache: ' "$out" || tail -n 5 "$out"
          rm -f "$out"
          exit "$status"
        executable: /bin/bash
      register: homedrive_import_full
      changed_when: false
      failed_when: false
      check_mode: false
      async: "{{ homedrive_import_timeout_s }}"
      poll: 60
      tags: [never, full]

    - name: Check every version reads back
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          out="$(mktemp)"
          status=0
          /usr/bin/podman exec homedrive hd-server fsck --deep > "$out" 2>&1 || status=$?
          { echo "== $(date -Is) fsck --deep (exit $status)"; cat "$out"; } >> {{ homedrive_import_log | quote }}
          head -n 50 "$out"
          rm -f "$out"
          exit "$status"
        executable: /bin/bash
      register: homedrive_import_fsck
      changed_when: false
      failed_when: false
      check_mode: false
      async: "{{ homedrive_import_timeout_s }}"
      poll: 60
      tags: [never, full]

    - name: Show what garbage collection would free
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          out="$(mktemp)"
          status=0
          /usr/bin/podman exec homedrive hd-server gc --dry-run > "$out" 2>&1 || status=$?
          { echo "== $(date -Is) gc --dry-run (exit $status)"; cat "$out"; } >> {{ homedrive_import_log | quote }}
          head -n 50 "$out"
          rm -f "$out"
          exit "$status"
        executable: /bin/bash
      register: homedrive_import_gc
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [never, full]

    - name: Show the full checks
      ansible.builtin.debug:
        msg:
          verify_tree: "{{ homedrive_import_full.stdout_lines }}"
          fsck: "{{ homedrive_import_fsck.stdout_lines }}"
          gc_dry_run: "{{ homedrive_import_gc.stdout_lines }}"
      tags: [never, full]

    - name: Require a clean verify-tree and fsck
      ansible.builtin.assert:
        that:
          - homedrive_import_full.rc == 0
          - homedrive_import_fsck.rc == 0
        fail_msg: >-
          verify-tree (exit {{ homedrive_import_full.rc }}) or fsck (exit
          {{ homedrive_import_fsck.rc }}) is not clean; see above and
          {{ homedrive_import_log }}. Do not retire the source.
      tags: [never, full]
