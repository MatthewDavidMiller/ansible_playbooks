---
# One-shot cleanup of what the retired Nextcloud, Paperless NGX, PostgreSQL and
# Redis roles left on VM1. vm1.yml no longer deploys any of them, so nothing
# else stops their services or removes their containers, images, networks,
# scripts, cron entries, secrets, logs, or Traefik routes. Every task is safe
# to repeat, and the play does nothing on a host that is already clean. Run it
# in check mode first (--check) to see what it would change.
#
# Order of work, once the final homedrive_import.yml full run is clean:
#   1. scripts/remove_nextcloud_inventory.py --write (renames and removes the
#      old inventory variables; see docs/variables.md, Obsolete variables)
#   2. vm1.yml, so VM1 matches the repository
#   3. this playbook, after a reboot of VM1 if Traefik still holds the routes'
#      networks (Podman will not remove a network a container uses)
#
# Data is kept unless a flag says otherwise, each of which needs
# retire_nextcloud_confirm_delete=delete as well:
#   retire_nextcloud_remove_nextcloud_data  Nextcloud's data, base, config and
#                                           apps folders under nextcloud_path
#   retire_nextcloud_remove_paperless_data  paperless_path (its data, media,
#                                           consume and export folders)
#   retire_nextcloud_remove_postgres_data   postgres_path (both databases)
# The Borg repository that holds the last Paperless and Nextcloud database
# backups lives inside nextcloud_path and is never removed by this playbook;
# neither are the older nextcloud_backup-* archives in the backup disk's
# repository. Prune those by hand when the backups are no longer wanted.
#
# The "Nextcloud" rclone remote stays in root's rclone config until vm1.yml
# rewrites it, which it does without that remote.
- name: Remove the retired Nextcloud stack from vm1
  hosts: vm1
  vars:
    retire_nextcloud_remove_nextcloud_data: false
    retire_nextcloud_remove_paperless_data: false
    retire_nextcloud_remove_postgres_data: false
    retire_nextcloud_confirm_delete: ""
    retire_nextcloud_data_path: "{{ nextcloud_path | default('/data_drive/nextcloud') }}"
    retire_nextcloud_paperless_path: "{{ paperless_path | default('/paperless') }}"
    retire_nextcloud_postgres_path: "{{ postgres_path | default('/postgres') }}"
    retire_nextcloud_borg_path: "{{ nextcloud_borg_backup_path | default(retire_nextcloud_data_path ~ '/borg_backup') }}"
    retire_nextcloud_secret_dir: "{{ secret_env_dir | default('/etc/homelab/secrets') }}"
    retire_nextcloud_units:
      - paperless_ngx
      - nextcloud_configure
      - nextcloud_container
      - redis_container
      - postgres_container
    retire_nextcloud_containers:
      - paperless
      - nextcloud
      - redis
      - postgres
    retire_nextcloud_cron_names:
      - Backup Nextcloud and Paperless NGX daily
      - Borg Backup
    retire_nextcloud_networks:
      - paperless_proxy_net
      - nextcloud_proxy_net
      - nextcloud_container_net
    retire_nextcloud_data_folders:
      - data
      - base
      - config
      - apps
    retire_nextcloud_paths:
      - /etc/systemd/system/paperless_ngx.service
      - /etc/systemd/system/nextcloud_configure.service
      - /etc/systemd/system/nextcloud_container.service
      - /etc/systemd/system/redis_container.service
      - /etc/systemd/system/postgres_container.service
      - /usr/local/bin/paperless_ngx.sh
      - /usr/local/bin/nextcloud_configure.sh
      - /usr/local/bin/nextcloud_container.sh
      - /usr/local/bin/nextcloud_scan_path.sh
      - /usr/local/bin/redis_container.sh
      - /usr/local/bin/postgres_container.sh
      - /usr/local/bin/backup_nextcloud_paperless.sh
      - /usr/local/bin/backup_files.sh
      - "{{ retire_nextcloud_secret_dir }}/paperless.env"
      - "{{ retire_nextcloud_secret_dir }}/nextcloud.env"
      - "{{ retire_nextcloud_secret_dir }}/redis.env"
      - "{{ retire_nextcloud_secret_dir }}/postgres.env"
      - /var/log/borg-backup.log
      - /var/log/borg-prune.log
      - /var/log/rclone-nextcloud-borg.log
  tasks:
    - name: Validate cleanup inputs
      ansible.builtin.assert:
        that:
          - retire_nextcloud_units | map('homelab_safe_name') | list | min
          - retire_nextcloud_containers | map('homelab_safe_name') | list | min
          - retire_nextcloud_networks | map('homelab_safe_name') | list | min
          - retire_nextcloud_paths | map('homelab_safe_absolute_path') | list | min
          - >-
            not (retire_nextcloud_remove_nextcloud_data | bool
                 or retire_nextcloud_remove_paperless_data | bool
                 or retire_nextcloud_remove_postgres_data | bool)
            or retire_nextcloud_confirm_delete == 'delete'
          - not (retire_nextcloud_remove_nextcloud_data | bool) or retire_nextcloud_data_path | homelab_safe_absolute_path
          - not (retire_nextcloud_remove_nextcloud_data | bool) or retire_nextcloud_data_path not in ['/opt', '/srv', '/var', '/home', '/data_drive', data_disk_mount_path | default('/data_drive')]
          - not (retire_nextcloud_remove_nextcloud_data | bool) or 'homedrive' not in retire_nextcloud_data_path
          - not (retire_nextcloud_remove_paperless_data | bool) or retire_nextcloud_paperless_path | homelab_safe_absolute_path
          - not (retire_nextcloud_remove_paperless_data | bool) or retire_nextcloud_paperless_path not in ['/opt', '/srv', '/var', '/home']
          - not (retire_nextcloud_remove_postgres_data | bool) or retire_nextcloud_postgres_path | homelab_safe_absolute_path
          - not (retire_nextcloud_remove_postgres_data | bool) or retire_nextcloud_postgres_path not in ['/opt', '/srv', '/var', '/home']
        fail_msg: >-
          Cleanup inputs must be safe names and paths. Removing any data needs
          retire_nextcloud_confirm_delete=delete. nextcloud_path must be its
          own folder, never a parent directory or anything under homedrive.

    # The last Paperless and database backups are in this repository, which
    # sits inside nextcloud_path. Only the four folders below are removed, so
    # it survives unless it was configured inside one of them.
    - name: Refuse to delete a folder that holds the Borg repository
      ansible.builtin.assert:
        that:
          - not (retire_nextcloud_borg_path ~ '/').startswith(retire_nextcloud_data_path ~ '/' ~ item ~ '/')
        fail_msg: >-
          {{ retire_nextcloud_borg_path }} is inside
          {{ retire_nextcloud_data_path }}/{{ item }}, which would be removed.
          Move the repository out first.
      loop: "{{ retire_nextcloud_data_folders }}"
      when: retire_nextcloud_remove_nextcloud_data | bool

    - name: Stop and disable the Nextcloud stack's services
      ansible.builtin.systemd:
        name: "{{ item }}.service"
        state: stopped
        enabled: false
      loop: "{{ retire_nextcloud_units }}"
      become: true
      register: retire_nextcloud_services
      failed_when:
        - retire_nextcloud_services is failed
        - "'could not be found' not in (retire_nextcloud_services.msg | default(''))"

    - name: Remove the Nextcloud stack's containers
      ansible.builtin.command:
        argv:
          - podman
          - rm
          - --ignore
          - --force
          - "{{ item }}"
      loop: "{{ retire_nextcloud_containers }}"
      become: true
      register: retire_nextcloud_container_removal
      changed_when: retire_nextcloud_container_removal.stdout | trim | length > 0

    - name: Remove the Nextcloud stack's cron entries
      ansible.builtin.cron:
        name: "{{ item }}"
        state: absent
      loop: "{{ retire_nextcloud_cron_names }}"
      become: true

    - name: Remove the Nextcloud stack's units, scripts, secrets, and logs
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ retire_nextcloud_paths }}"
      become: true

    - name: Reload systemd after removing the units
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: List the images
      ansible.builtin.command:
        argv:
          - podman
          - images
          - --format
          - "{% raw %}{{.ID}} {{.Repository}}{% endraw %}"
      become: true
      register: retire_nextcloud_images
      changed_when: false
      check_mode: false

    - name: Remove the Nextcloud stack's images
      ansible.builtin.command:
        argv:
          - podman
          - rmi
          - --force
          - "{{ item }}"
      loop: >-
        {{ retire_nextcloud_images.stdout_lines
           | select('search', '/(nextcloud|postgres|redis|paperless-ngx)$')
           | map('split', ' ')
           | map('first')
           | unique
           | list }}
      become: true
      changed_when: true

    - name: Check for the Nextcloud stack's networks
      ansible.builtin.command:
        argv:
          - podman
          - network
          - exists
          - "{{ item }}"
      loop: "{{ retire_nextcloud_networks }}"
      become: true
      register: retire_nextcloud_network_presence
      changed_when: false
      failed_when: false
      check_mode: false

    # Podman refuses to remove a network a container still uses. That means
    # Traefik has not restarted since vm1.yml dropped the routes; reboot, then
    # run this again.
    - name: Remove the Nextcloud stack's networks
      ansible.builtin.command:
        argv:
          - podman
          - network
          - rm
          - "{{ item.item }}"
      loop: "{{ retire_nextcloud_network_presence.results }}"
      loop_control:
        label: "{{ item.item }}"
      become: true
      when: item.rc == 0
      changed_when: true

    - name: Find the Nextcloud and Paperless Traefik route files
      ansible.builtin.find:
        paths: "{{ traefik_path | default('/traefik') }}/config"
        patterns: "*.yml"
        excludes:
          - tls.yml
          - security.yml
          - dashboard.yml
        contains: "nextcloud|paperless"
        use_regex: true
      become: true
      register: retire_nextcloud_routes

    - name: Remove the Nextcloud and Paperless Traefik route files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ retire_nextcloud_routes.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      become: true

    - name: Remove Nextcloud's data folders
      ansible.builtin.file:
        path: "{{ retire_nextcloud_data_path }}/{{ item }}"
        state: absent
      loop: "{{ retire_nextcloud_data_folders }}"
      become: true
      when: retire_nextcloud_remove_nextcloud_data | bool

    - name: Remove Paperless' data
      ansible.builtin.file:
        path: "{{ retire_nextcloud_paperless_path }}"
        state: absent
      become: true
      when: retire_nextcloud_remove_paperless_data | bool

    - name: Remove the PostgreSQL data
      ansible.builtin.file:
        path: "{{ retire_nextcloud_postgres_path }}"
        state: absent
      become: true
      when: retire_nextcloud_remove_postgres_data | bool

    - name: Report what was kept
      ansible.builtin.debug:
        msg: >-
          Kept: {{ 'nothing was removed from the data folders' if (retire_nextcloud_remove_nextcloud_data | bool and retire_nextcloud_remove_paperless_data | bool and retire_nextcloud_remove_postgres_data | bool) else
          (([] if retire_nextcloud_remove_nextcloud_data | bool else [retire_nextcloud_data_path ~ ' (Nextcloud data)'])
           + ([] if retire_nextcloud_remove_paperless_data | bool else [retire_nextcloud_paperless_path ~ ' (Paperless)'])
           + ([] if retire_nextcloud_remove_postgres_data | bool else [retire_nextcloud_postgres_path ~ ' (PostgreSQL)'])) | join(', ') }}.
          The Borg repository {{ retire_nextcloud_borg_path }} is never
          removed here. Delete the rest by hand, or run again with the
          retire_nextcloud_remove_* flags and
          retire_nextcloud_confirm_delete=delete.
