---
# backup role defaults (the backup disk and its Borg repository)
#
# The role mounts the backup disk and makes sure the repository exists.
# homedrive's store backup (backup_homedrive.sh) writes into it.

# Path to the Borg repository directory (on the backup disk)
borg_backup_path: /borg_backups

# Block device identifier for the backup disk mount (e.g. "UUID=xxxx-xxxx")
backup_disk: ""
