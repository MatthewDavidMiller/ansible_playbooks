---
- name: Validate deferred container network migration inputs
  ansible.builtin.assert:
    that:
      - container_service_names | default('') | trim | length > 0
      - container_network_migration_delay is match('^[1-9][0-9]*(s|min|h)$')
    fail_msg: Configure a service restart order and a positive systemd time span.
  when:
    - apply_runtime_changes_on_reboot | default(false) | bool
    - container_network_migrations | default([]) | length > 0

- name: Validate deferred container network migration service names
  ansible.builtin.assert:
    that:
      - container_service_name | homelab_safe_name
    fail_msg: Each deferred migration service must have a safe systemd unit name.
  loop: "{{ container_service_names.split() }}"
  loop_control:
    loop_var: container_service_name
  when:
    - apply_runtime_changes_on_reboot | default(false) | bool
    - container_network_migrations | default([]) | length > 0

- name: Validate deferred container network definitions
  ansible.builtin.assert:
    that:
      - container_network_migration.name | homelab_safe_name
      - container_network_migration.subnet | default('') | length == 0
        or container_network_migration.subnet | homelab_valid_ipv4_cidr
      - (container_network_migration.internal | default(true)) is boolean
    fail_msg: >-
      Each deferred migration needs a safe network name, an optional valid
      IPv4 subnet, and a boolean internal-network setting.
  loop: "{{ container_network_migrations | default([]) }}"
  loop_control:
    loop_var: container_network_migration
  when:
    - apply_runtime_changes_on_reboot | default(false) | bool
    - container_network_migrations | default([]) | length > 0

- name: Install deferred container network migration script
  ansible.builtin.template:
    src: migrate_container_networks.sh.j2
    dest: /usr/local/bin/migrate_container_networks.sh
    owner: root
    group: root
    mode: "0700"
  when:
    - apply_runtime_changes_on_reboot | default(false) | bool
    - container_network_migrations | default([]) | length > 0

- name: Schedule deferred container network migration
  ansible.builtin.command:
    argv:
      - systemd-run
      - "--unit=homelab-container-network-migration-{{ ansible_date_time.epoch }}"
      - --collect
      - "--on-active={{ container_network_migration_delay }}"
      - /usr/bin/bash
      - /usr/local/bin/migrate_container_networks.sh
  changed_when: true
  when:
    - apply_runtime_changes_on_reboot | default(false) | bool
    - container_network_migrations | default([]) | length > 0
