---
# data_disk role defaults
#
# The disk that holds homedrive's store and exports. It has a role of its own,
# ahead of every role that keeps files on it, so the mount is made before any
# of them creates a directory under it (that would land on the OS disk) and
# outlives whichever service is removed.

# Block device identifier for the data disk (e.g. "UUID=xxxx-xxxx").
data_disk: ""

# Where it is mounted. The disk is shared, so services keep their data in
# folders inside it (/data_drive/homedrive/store).
data_disk_mount_path: /data_drive
