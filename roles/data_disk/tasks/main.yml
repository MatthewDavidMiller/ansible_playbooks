---
- name: Validate data disk inputs before changing the host
  ansible.builtin.assert:
    that:
      - data_disk | length > 0
      - data_disk_mount_path | homelab_safe_absolute_path
      - data_disk_mount_path not in ['/', '/boot', '/etc', '/home', '/opt', '/srv', '/usr', '/var']
    fail_msg: >-
      Set data_disk to the data disk's UUID entry, and
      data_disk_mount_path to a folder of its own, not a system path. The
      stores that live on it refuse to start on an unmounted disk, but they
      must never be created on the OS disk in the first place.

# Mounted before anything creates a directory inside it: made first, the
# directory would land on the OS disk under the mount point.
- name: Mount the data disk
  ansible.posix.mount:
    path: "{{ data_disk_mount_path }}"
    src: "{{ data_disk }}"
    fstype: ext4
    opts: rw,auto
    state: mounted

- name: Set data disk root ownership
  ansible.builtin.file:
    path: "{{ data_disk_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The mount task would report success for a path that is only a directory in
# some modes; this is what stops the roles after it if it is not the disk.
- name: Check the data disk is mounted
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ data_disk_mount_path }}"
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
