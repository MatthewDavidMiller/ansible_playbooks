---
# User that owns interactive Codex/Claude Code tooling.
dev_vm_user: "{{ user_name }}"

# User-local npm prefix. Avoids sudo npm global installs.
dev_vm_npm_prefix: "/home/{{ dev_vm_user }}/.npm-global"

# Named tmux session used by the devmux helper.
dev_vm_tmux_session: dev

# Parent workspace directory (created empty; no auto git clone).
dev_vm_workspace_path: "/home/{{ dev_vm_user }}/matt_dev"

dev_vm_packages:
  - tmux
  - git
  - nodejs
  - npm
  # Node.js 22.23 uses ares_query_dnsrec, which is absent from the original
  # Rocky 10 c-ares 1.25 package. A version floor prevents security-only Node
  # updates from leaving libnode paired with that older, ABI-incompatible RPM.
  - 'c-ares >= 1.34.6-1.el10'
  - python3
  - python3-pip
  - '@Development Tools'
  - jq
  - curl
  - wget
  - unzip
  - tar
  - ripgrep
  - fd-find
  - bubblewrap
  - podman
  - fuse-overlayfs
  - passt
  - shadow-utils
  - golang
  - rust
  - cargo
  - ansible-core
  - tree
  - ShellCheck
  - gh

# Docker Engine is intentionally removed from VM2. Keep the package list here
# only as the declarative removal set for hosts converged from older revisions.
dev_vm_removed_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - docker-ce-rootless-extras

# Rootless Podman subordinate-ID range used only when the existing dev user has
# no entry in /etc/subuid or /etc/subgid. VM2 is a single-user development host.
dev_vm_rootless_subid_start: 100000
dev_vm_rootless_subid_count: 65536

dev_vm_npm_global_packages:
  - '@openai/codex'
  - '@anthropic-ai/claude-code'

# npm module state for agent CLIs. Use "present" for stable converges; set to
# "latest" when deliberately refreshing CLIs. Pin versions in the package list
# with name@version syntax (e.g. @anthropic-ai/claude-code@1.2.3).
dev_vm_npm_global_state: present

# User-local Python CLI tools needed for validating this repository.
# Keep Python CLIs on pip --user for a consistent user-local PATH alongside
# ansible-lint / pre-commit (not system RPMs). Guarded by
# scripts/test_dev_vm_packages.sh (pre-commit).
dev_vm_python_user_base: "/home/{{ dev_vm_user }}/.local"
dev_vm_python_user_packages:
  - ansible-lint==26.4.0
  - pre-commit==4.6.0
  - yamllint==1.38.0

# Optional git identity for the dev user (no secrets). Empty = leave unset.
dev_vm_git_user_name: ""
dev_vm_git_user_email: ""

# Install repo-pinned collections when this checkout exists on the dev VM.
dev_vm_install_project_collections: true
dev_vm_ansible_project_path: "/home/{{ dev_vm_user }}/matt_dev/ansible_playbooks"
dev_vm_ansible_collection_requirements: "{{ dev_vm_ansible_project_path }}/collections/requirements.yml"
dev_vm_ansible_collection_path: "{{ dev_vm_ansible_project_path }}/collections"

# Managed PATH roots for agent CLIs (login profile.d + interactive bashrc).
dev_vm_path_entries:
  - "{{ dev_vm_npm_prefix }}/bin"
  - "{{ dev_vm_python_user_base }}/bin"
