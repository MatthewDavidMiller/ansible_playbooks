---
- name: Remove Podman Docker compatibility shim before Docker Engine install
  ansible.builtin.dnf:
    name: podman-docker
    state: absent

- name: Configure Docker CE stable repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: "https://download.docker.com/linux/rhel/$releasever/$basearch/stable"
    enabled: true
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/rhel/gpg

- name: Install Docker Engine packages
  ansible.builtin.dnf:
    name: "{{ dev_vm_docker_packages }}"
    state: present

- name: Enable Docker service for local container validation
  ansible.builtin.systemd:
    name: docker.service
    enabled: true
    state: started

- name: Allow dev user to run Docker validation commands
  ansible.builtin.user:
    name: "{{ dev_vm_user }}"
    groups: docker
    append: true

# docker group membership is effectively root-equivalent; intentional for a
# single-user dev VM. See docs/security.md and docs/roles/standard.md.

- name: Prune unused Docker data when explicitly enabled
  ansible.builtin.command:
    cmd: docker system prune -f
  register: dev_vm_docker_prune_result
  changed_when: >-
    'Total reclaimed space: 0B' not in dev_vm_docker_prune_result.stdout
    and 'Total reclaimed space: 0 B' not in dev_vm_docker_prune_result.stdout
  when: dev_vm_docker_prune | bool
