---
- name: Ensure user-local Grok downloads directory exists
  ansible.builtin.file:
    path: "/home/{{ dev_vm_user }}/.grok/downloads"
    state: directory
    owner: "{{ dev_vm_user }}"
    mode: "0755"

- name: Download Grok Build installer script for dev user
  ansible.builtin.get_url:
    url: "{{ dev_vm_grok_installer_url }}"
    dest: "/home/{{ dev_vm_user }}/.grok/downloads/install.sh"
    owner: "{{ dev_vm_user }}"
    mode: "0700"
    force: "{{ dev_vm_grok_update | bool }}"
  become: true
  become_user: "{{ dev_vm_user }}"

- name: Install Grok Build CLI for dev user (first install)
  ansible.builtin.shell:
    cmd: "bash /home/{{ dev_vm_user }}/.grok/downloads/install.sh"
  args:
    executable: /bin/bash
    creates: "/home/{{ dev_vm_user }}/.grok/bin/grok"
  become: true
  become_user: "{{ dev_vm_user }}"
  environment:
    HOME: "/home/{{ dev_vm_user }}"
  when: not (dev_vm_grok_update | bool)
  # The upstream installer is safe to re-run; the creates guard keeps repeated
  # playbook applications clean when dev_vm_grok_update is false. To force the
  # latest release set dev_vm_grok_update: true, remove the binary on the host,
  # or run `grok update` interactively inside the devmux session.

- name: Update Grok Build CLI for dev user
  ansible.builtin.shell:
    cmd: "bash /home/{{ dev_vm_user }}/.grok/downloads/install.sh"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ dev_vm_user }}"
  environment:
    HOME: "/home/{{ dev_vm_user }}"
  register: dev_vm_grok_update_result
  changed_when: true
  when: dev_vm_grok_update | bool
