---
- name: Configure official Trivy RPM repository
  ansible.builtin.yum_repository:
    name: trivy
    description: Trivy repository
    baseurl: "{{ dev_vm_trivy_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ dev_vm_trivy_repo_gpgkey }}"
    enabled: true

- name: Install dev workstation packages
  ansible.builtin.dnf:
    name: "{{ dev_vm_packages }}"
    state: present

- name: Install checksum-pinned Hadolint
  ansible.builtin.get_url:
    url: "{{ dev_vm_hadolint_url }}"
    dest: /usr/local/bin/hadolint
    checksum: "sha256:{{ dev_vm_hadolint_sha256 }}"
    owner: root
    group: root
    mode: "0755"

- name: Verify Node.js runtime dependencies are compatible
  ansible.builtin.command:
    cmd: /usr/bin/node --version
  changed_when: false

- name: Verify Hadolint is available
  ansible.builtin.command:
    cmd: /usr/local/bin/hadolint --version
  changed_when: false

- name: Verify playlist generator Tkinter dependency
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - import tkinter
  changed_when: false

- name: Verify playlist generator FFmpeg libopus encoder
  ansible.builtin.command:
    argv:
      - /usr/bin/ffmpeg
      - -hide_banner
      - -encoders
  register: dev_vm_ffmpeg_encoders
  changed_when: false
  failed_when: >-
    dev_vm_ffmpeg_encoders.rc != 0 or
    'libopus' not in dev_vm_ffmpeg_encoders.stdout

- name: Verify playlist generator FFmpeg loudnorm filter
  ansible.builtin.command:
    argv:
      - /usr/bin/ffmpeg
      - -hide_banner
      - -filters
  register: dev_vm_ffmpeg_filters
  changed_when: false
  failed_when: >-
    dev_vm_ffmpeg_filters.rc != 0 or
    'loudnorm' not in dev_vm_ffmpeg_filters.stdout

- name: Ensure user-local bin directory exists
  ansible.builtin.file:
    path: "{{ dev_vm_python_user_base }}/bin"
    state: directory
    owner: "{{ dev_vm_user }}"
    mode: "0755"

- name: Locate system fdfind binary
  ansible.builtin.shell:
    cmd: command -v fdfind
  args:
    executable: /bin/bash
  register: fdfind_which
  changed_when: false
  failed_when: false
  check_mode: false

- name: Symlink fd when fdfind is installed
  ansible.builtin.file:
    src: "{{ fdfind_which.stdout }}"
    dest: "{{ dev_vm_python_user_base }}/bin/fd"
    state: link
    owner: "{{ dev_vm_user }}"
    force: true
  when:
    - fdfind_which.rc == 0
    - fdfind_which.stdout | length > 0

- name: Ensure workspace parent directory exists
  ansible.builtin.file:
    path: "{{ dev_vm_workspace_path }}"
    state: directory
    owner: "{{ dev_vm_user }}"
    mode: "0755"
