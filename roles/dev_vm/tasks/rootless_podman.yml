---
- name: Gather service state before removing Docker Engine
  ansible.builtin.service_facts:

- name: Disable legacy Docker Engine services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - docker.service
    - docker.socket
    - containerd.service
  when: item in ansible_facts.services

- name: Remove legacy Docker Engine packages
  ansible.builtin.dnf:
    name: "{{ dev_vm_removed_docker_packages }}"
    state: absent

- name: Remove legacy Docker CE repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    state: absent

- name: Read dev user supplementary groups
  ansible.builtin.command:
    argv:
      - /usr/bin/id
      - -nG
      - "{{ dev_vm_user }}"
  register: dev_vm_user_groups
  changed_when: false

- name: Remove dev user from root-equivalent Docker group
  ansible.builtin.command:
    argv:
      - /usr/bin/gpasswd
      - --delete
      - "{{ dev_vm_user }}"
      - docker
  when: "'docker' in dev_vm_user_groups.stdout.split()"

- name: Check dev user subordinate UID allocation
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - -q
      - "^{{ dev_vm_user }}:"
      - /etc/subuid
  register: dev_vm_subuid_present
  changed_when: false
  failed_when: false

- name: Ensure proposed subordinate UID range does not overlap another user
  ansible.builtin.command:
    argv:
      - /usr/bin/awk
      - "-F:"
      - -v
      - "user={{ dev_vm_user }}"
      - -v
      - "start={{ dev_vm_rootless_subid_start }}"
      - -v
      - "end={{ (dev_vm_rootless_subid_start | int) + (dev_vm_rootless_subid_count | int) - 1 }}"
      - '$1 != user && start <= ($2 + $3 - 1) && end >= $2 { exit 1 }'
      - /etc/subuid
  changed_when: false
  when: dev_vm_subuid_present.rc != 0

- name: Allocate subordinate UIDs for rootless Podman
  ansible.builtin.command:
    argv:
      - /usr/sbin/usermod
      - --add-subuids
      - "{{ dev_vm_rootless_subid_start }}-{{ (dev_vm_rootless_subid_start | int) + (dev_vm_rootless_subid_count | int) - 1 }}"
      - "{{ dev_vm_user }}"
  when: dev_vm_subuid_present.rc != 0

- name: Check dev user subordinate GID allocation
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - -q
      - "^{{ dev_vm_user }}:"
      - /etc/subgid
  register: dev_vm_subgid_present
  changed_when: false
  failed_when: false

- name: Ensure proposed subordinate GID range does not overlap another user
  ansible.builtin.command:
    argv:
      - /usr/bin/awk
      - "-F:"
      - -v
      - "user={{ dev_vm_user }}"
      - -v
      - "start={{ dev_vm_rootless_subid_start }}"
      - -v
      - "end={{ (dev_vm_rootless_subid_start | int) + (dev_vm_rootless_subid_count | int) - 1 }}"
      - '$1 != user && start <= ($2 + $3 - 1) && end >= $2 { exit 1 }'
      - /etc/subgid
  changed_when: false
  when: dev_vm_subgid_present.rc != 0

- name: Allocate subordinate GIDs for rootless Podman
  ansible.builtin.command:
    argv:
      - /usr/sbin/usermod
      - --add-subgids
      - "{{ dev_vm_rootless_subid_start }}-{{ (dev_vm_rootless_subid_start | int) + (dev_vm_rootless_subid_count | int) - 1 }}"
      - "{{ dev_vm_user }}"
  when: dev_vm_subgid_present.rc != 0

- name: Validate rootless Podman for the dev user
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - info
      - --format
      - "{{ '{{.Host.Security.Rootless}}' }}"
  become: true
  become_user: "{{ dev_vm_user }}"
  environment:
    HOME: "/home/{{ dev_vm_user }}"
  register: dev_vm_rootless_podman_info
  changed_when: false

- name: Assert rootless Podman is active
  ansible.builtin.assert:
    that:
      - dev_vm_rootless_podman_info.stdout | trim == 'true'
    fail_msg: "Podman must run rootless for {{ dev_vm_user }} after Docker Engine removal."
