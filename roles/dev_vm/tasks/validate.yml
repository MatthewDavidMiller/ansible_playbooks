---
- name: Validate dev VM user input
  ansible.builtin.assert:
    that:
      - dev_vm_user | length > 0
      - dev_vm_npm_prefix is match('^/home/[^/]+/.+')
      - dev_vm_npm_global_state in ['present', 'latest']
      - dev_vm_rootless_subid_start | int >= 65536
      - dev_vm_rootless_subid_count | int >= 65536
      - ansible_architecture == 'x86_64'
      - dev_vm_hadolint_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
      - dev_vm_hadolint_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Set dev_vm_user and dev_vm_npm_prefix to a user-owned path under /home,
      set dev_vm_npm_global_state to present or latest, and reserve a valid
      subordinate-ID range for rootless Podman. The pinned Hadolint binary also
      requires an x86_64 host, a semantic v-prefixed version, and a SHA-256
      checksum.

- name: Confirm dev VM user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ dev_vm_user }}"
