---
# music_server role defaults
#
# music-server is the first-party Subsonic music server
# (https://github.com/MatthewDavidMiller/music-server). The role is off until
# music_server_enabled is true, and it refuses to run until the image has a
# reviewed entry in artifacts/containers.lock.yml.

# Deploy music-server on this host
music_server_enabled: false

# Host directory holding data/ (sealed roster and user data, backed up) and
# cache/ (library index and resized covers, rebuildable).
music_server_path: /music_server

# Where the library comes from: "homedrive", homedrive's read-only export of
# the Music folder, whenever homedrive is deployed; otherwise "path", the
# folder music_server_music_path names. Set "path" in the inventory to keep
# using that folder. Tracks are identified by their path inside the library,
# and the export keeps those paths, so playlists and stars carry across.
music_server_library: "{{ 'homedrive' if homedrive_enabled | default(false) | bool else 'path' }}"

# homedrive's Music export (homedrive_exports names it "music"). Keep in step
# with the homedrive role's homedrive_export_path default.
music_server_homedrive_library: "{{ homedrive_export_path | default('/data_drive/homedrive/exports') }}/music"

# The library folder when music_server_library is "path", mounted
# read-only.
music_server_music_path: ""

# The 256-bit master key, as 64 hex digits (`music-server gen-key`). The
# roster and every user's playlists, stars, and plays are sealed under keys
# derived from it; keep a copy in Vaultwarden.
music_server_master_key: ""

# The accounts, from Vault. Each entry: {name, password, admin}. Names are
# 1-64 of A-Z a-z 0-9 . _ -; passwords 8-128 characters; at least one admin.
# A name removed here is disabled on the next start, its data kept.
music_server_users: []

# Rescan interval in minutes; 0 scans only at startup and on request
music_server_scan_interval_minutes: 60

# Concurrent ffmpeg transcodes (0-8)
music_server_max_transcodes: 2

# Container memory ceiling, also used as the swap ceiling (no swap)
music_server_memory: 512m

# The container user the image declares
music_server_uid: "10001"
music_server_gid: "10001"

# Supplementary group that can read the music when music_server_library is
# "path".
music_server_music_gid: "33"

# Folder for backup uploads (the folder in homedrive_backup_user's drive, e.g. "music_server_backup")
music_server_backup_location: ""

# Root-only directory for runtime environment files and secret sources
secret_env_dir: /etc/homelab/secrets

# Container image resolved from the approved artifact lock in vm1.yml
music_server_image: ""

# Podman DNS aliases used on VM1 networks.
container_dns:
  domain: dns.podman
  aliases:
    music_server_proxy: music-server-proxy

# Deterministic VM1 route proxy network subnet.
route_proxy_network_subnets:
  music_server_container_net: 172.16.1.48/29

# Static container IP used with Traefik /etc/hosts overrides.
container_static_ips:
  music_server_proxy: 172.16.1.50

# Traefik's address on the music network; the server trusts its
# X-Forwarded-For for login throttling.
route_proxy_traefik_ips:
  music_server_container_net: 172.16.1.51

# The homedrive account whose drive holds the backups (one of homedrive_users),
# in the folder named by <name>_backup_location. By default homedrive_main_user.
homedrive_backup_user: "{{ homedrive_main_user | default('') }}"

# When the daily backup runs (VM1's local time). The service backups go first, at
# midnight, so the homedrive store's own backup (01:30) holds them.
music_server_backup_hour: "0"
music_server_backup_minute: "0"
