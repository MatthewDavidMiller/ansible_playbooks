---
- name: Validate Navidrome inputs before changing the host
  ansible.builtin.assert:
    that:
      - navidrome_path | homelab_safe_absolute_path
      - navidrome_image | homelab_immutable_digest_ref
      - route_proxy_network_subnets.navidrome_container_net | homelab_valid_ipv4_cidr
      - container_static_ips.navidrome_proxy | homelab_container_assignable_ip(route_proxy_network_subnets.navidrome_container_net)
      - not (backup_local | bool) or nextcloud_path | homelab_safe_absolute_path
      - not (backup_local | bool) or nextcloud_homelab_user | homelab_safe_name
      - (navidrome_uid | string) is match('^[0-9]+$')
      - (navidrome_gid | string) is match('^[0-9]+$')
    fail_msg: Configure safe paths, an immutable image, a valid network, and numeric Navidrome IDs.

- name: Reconcile Navidrome proxy network
  ansible.builtin.include_role:
    name: container_network
  vars:
    container_network_name: navidrome_container_net
    container_network_subnet: "{{ route_proxy_network_subnets.navidrome_container_net }}"

- name: Create Navidrome managed paths
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ navidrome_uid }}"
    group: "{{ navidrome_gid }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ navidrome_path }}"
      mode: "0750"
    - path: "{{ navidrome_path }}/music"
      mode: "0750"
    - path: "{{ navidrome_path }}/data"
      mode: "0700"
    - path: "{{ navidrome_path }}/backup"
      mode: "0700"

- name: Align Navidrome writable path ownership
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ navidrome_uid }}"
    group: "{{ navidrome_gid }}"
    recurse: true
  loop:
    - "{{ navidrome_path }}/data"
    - "{{ navidrome_path }}/backup"

- name: Navidrome Service
  ansible.builtin.template:
    src: navidrome_container.service.j2
    dest: /etc/systemd/system/navidrome_container.service
    owner: root
    group: root
    mode: "0644"

- name: Enable Navidrome
  ansible.builtin.systemd:
    name: navidrome_container.service
    daemon_reload: true
    enabled: true

- name: Navidrome script
  ansible.builtin.template:
    src: navidrome_container.sh.j2
    dest: /usr/local/bin/navidrome_container.sh
    owner: root
    group: root
    mode: "0700"

- name: Install zip and jq packages
  ansible.builtin.dnf:
    name:
      - zip
      - jq
    state: present

- name: Create Navidrome Nextcloud backup destination
  ansible.builtin.file:
    path: "{{ nextcloud_path }}/data/{{ nextcloud_homelab_user }}/files/{{ navidrome_backup_location | replace('Nextcloud:', '') }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    mode: "0770"
  when: backup_local | default(false)

- name: Repair Navidrome Nextcloud backup destination ownership
  ansible.builtin.file:
    path: "{{ nextcloud_path }}/data/{{ nextcloud_homelab_user }}/files/{{ navidrome_backup_location | replace('Nextcloud:', '') }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    recurse: true
  when: backup_local | default(false)

- name: Backup navidrome script
  ansible.builtin.template:
    src: backup_navidrome.sh.j2
    dest: /usr/local/bin/backup_navidrome.sh
    owner: root
    group: root
    mode: "0700"

- name: Backup navidrome daily
  ansible.builtin.cron:
    name: Backup navidrome daily
    special_time: daily
    job: /usr/bin/bash /usr/local/bin/backup_navidrome.sh

- name: Start Navidrome
  ansible.builtin.systemd:
    name: navidrome_container.service
    state: started
  when: not (apply_runtime_changes_on_reboot | default(false) | bool)
