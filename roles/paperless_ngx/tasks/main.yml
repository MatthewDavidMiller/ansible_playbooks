---
- name: Validate Paperless inputs before changing the host
  ansible.builtin.assert:
    that:
      - secret_env_dir | homelab_safe_absolute_path
      - paperless_path | homelab_safe_absolute_path
      - paperless_data_path | homelab_safe_absolute_path
      - paperless_media_path | homelab_safe_absolute_path
      - paperless_export_path | homelab_safe_absolute_path
      - paperless_consume_path | homelab_safe_absolute_path
      - paperless_image | homelab_immutable_digest_ref
      - route_proxy_network_subnets.paperless_proxy_net | homelab_valid_ipv4_cidr
      - container_static_ips.paperless_proxy | homelab_container_assignable_ip(route_proxy_network_subnets.paperless_proxy_net)
      - route_proxy_traefik_ips.paperless_proxy_net | homelab_container_assignable_ip(route_proxy_network_subnets.paperless_proxy_net)
      - password_minimum_length | int >= 1
      - paperless_db_password | length >= password_minimum_length | int
      - secret_key_minimum_length | int >= 1
      - paperless_secret_key | length >= secret_key_minimum_length | int
    fail_msg: Configure safe paths, an immutable image, a valid network, a strong Paperless database secret, and a unique Paperless signing key.
  no_log: true

- name: Create paperless secret directory
  ansible.builtin.file:
    path: "{{ secret_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Paperless env file
  ansible.builtin.template:
    src: paperless.env.j2
    dest: "{{ secret_env_dir }}/paperless.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Reconcile Paperless proxy network
  ansible.builtin.include_role:
    name: container_network
  vars:
    container_network_name: paperless_proxy_net
    container_network_subnet: "{{ route_proxy_network_subnets.paperless_proxy_net }}"

- name: Create paperless paths
  ansible.builtin.file:
    path: "{{ item_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0770"
  loop:
    - "{{ paperless_path }}"
    - "{{ paperless_data_path }}"
    - "{{ paperless_media_path }}"
    - "{{ paperless_export_path }}"
    - "{{ paperless_consume_path }}"

  loop_control:
    loop_var: item_path

- name: Paperless Service
  ansible.builtin.template:
    src: paperless_ngx.service.j2
    dest: /etc/systemd/system/paperless_ngx.service
    owner: root
    group: root
    mode: "0644"

- name: Enable paperless
  ansible.builtin.systemd:
    name: paperless_ngx.service
    enabled: true
    daemon_reload: true

- name: Paperless script
  ansible.builtin.template:
    src: paperless_ngx.sh.j2
    dest: /usr/local/bin/paperless_ngx.sh
    owner: root
    group: root
    mode: "0700"

- name: Install zip and jq packages
  ansible.builtin.dnf:
    name:
      - zip
      - jq
    state: present

- name: Start paperless
  ansible.builtin.systemd:
    name: paperless_ngx.service
    state: started
  when: not (apply_runtime_changes_on_reboot | default(false) | bool)
