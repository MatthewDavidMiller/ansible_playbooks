---
- name: Skip playbook-runner unless it is enabled
  ansible.builtin.meta: end_role
  when: not (playbook_runner_enabled | bool)

- name: Validate playbook-runner inputs before changing the host
  ansible.builtin.assert:
    that:
      - playbook_runner_master_key is match('^[0-9a-fA-F]{64}$')
      - playbook_runner_admin_password | length == 0 or (playbook_runner_admin_password | length >= 12 and playbook_runner_admin_password | length <= 128)
      - playbook_runner_path | homelab_safe_absolute_path
      - secret_env_dir | homelab_safe_absolute_path
      - playbook_runner_image | homelab_immutable_digest_ref
      - playbook_runner_uid is match('^[0-9]+$')
      - playbook_runner_gid is match('^[0-9]+$')
      - playbook_runner_timezone is match('^[A-Za-z0-9_+/-]+$')
      - playbook_runner_keep_runs | int >= 10
      - route_proxy_network_subnets.playbook_runner_container_net | homelab_valid_ipv4_cidr
      - container_static_ips.playbook_runner_proxy | homelab_container_assignable_ip(route_proxy_network_subnets.playbook_runner_container_net)
      - route_proxy_traefik_ips.playbook_runner_container_net | homelab_container_assignable_ip(route_proxy_network_subnets.playbook_runner_container_net)
      - playbook_runner_egress_network | homelab_safe_name
      - playbook_runner_egress_network not in ['nextcloud_container_net', 'playbook_runner_container_net']
      - not (backup_local | bool) or nextcloud_path | homelab_safe_absolute_path
      - not (backup_local | bool) or nextcloud_homelab_user | homelab_safe_name
    fail_msg: >-
      Configure a 64-hex-digit master key, a 12-128 character admin password or none,
      safe paths, an immutable image (lock playbook_runner in artifacts/containers.lock.yml),
      and valid networks.
  no_log: true

- name: Reconcile playbook-runner proxy network
  ansible.builtin.include_role:
    name: container_network
  vars:
    container_network_name: playbook_runner_container_net
    container_network_subnet: "{{ route_proxy_network_subnets.playbook_runner_container_net }}"

- name: Reconcile playbook-runner egress network
  ansible.builtin.include_role:
    name: container_network
  vars:
    container_network_name: "{{ playbook_runner_egress_network }}"
    container_network_internal: false

- name: Create playbook-runner secret directory
  ansible.builtin.file:
    path: "{{ secret_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create playbook-runner data directory
  ansible.builtin.file:
    path: "{{ playbook_runner_path }}"
    state: directory
    owner: "{{ playbook_runner_uid }}"
    group: "{{ playbook_runner_gid }}"
    mode: "0700"

- name: Seed the playbook-runner known_hosts file
  ansible.builtin.copy:
    content: "{{ playbook_runner_known_hosts | trim }}\n"
    dest: "{{ playbook_runner_path }}/known_hosts"
    owner: "{{ playbook_runner_uid }}"
    group: "{{ playbook_runner_gid }}"
    mode: "0600"
    force: false
  when: playbook_runner_known_hosts | trim | length > 0

# The key is rendered to a root-only source file first so the Podman secret
# is only replaced when the value actually changes.
- name: Playbook-runner master key source
  ansible.builtin.copy:
    content: "{{ playbook_runner_master_key | lower }}\n"
    dest: "{{ secret_env_dir }}/playbook_runner_master_key"
    owner: root
    group: root
    mode: "0600"
  register: playbook_runner_master_key_file
  no_log: true

- name: Playbook-runner admin password source
  ansible.builtin.copy:
    content: "{{ playbook_runner_admin_password }}\n"
    dest: "{{ secret_env_dir }}/playbook_runner_admin_password"
    owner: root
    group: root
    mode: "0600"
  register: playbook_runner_admin_password_file
  when: playbook_runner_admin_password | length > 0
  no_log: true

- name: Check for the playbook-runner Podman secrets
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - exists
      - "{{ item }}"
  loop:
    - playbook_runner_master_key
    - playbook_runner_admin_password
  register: playbook_runner_secret_presence
  check_mode: false
  changed_when: false
  failed_when: false

- name: Create the playbook-runner master key secret
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - create
      - --replace
      - playbook_runner_master_key
      - "{{ secret_env_dir }}/playbook_runner_master_key"
  when: playbook_runner_master_key_file is changed or playbook_runner_secret_presence.results[0].rc != 0
  changed_when: true

- name: Create the playbook-runner admin password secret
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - create
      - --replace
      - playbook_runner_admin_password
      - "{{ secret_env_dir }}/playbook_runner_admin_password"
  when:
    - playbook_runner_admin_password | length > 0
    - playbook_runner_admin_password_file is changed or playbook_runner_secret_presence.results[1].rc != 0
  changed_when: true

- name: Playbook-runner service
  ansible.builtin.template:
    src: playbook_runner.service.j2
    dest: /etc/systemd/system/playbook_runner.service
    owner: root
    group: root
    mode: "0644"

- name: Enable playbook-runner
  ansible.builtin.systemd:
    name: playbook_runner.service
    enabled: true
    daemon_reload: true

- name: Playbook-runner script
  ansible.builtin.template:
    src: playbook_runner.sh.j2
    dest: /usr/local/bin/playbook_runner.sh
    owner: root
    group: root
    mode: "0700"

- name: Create playbook-runner Nextcloud backup destination
  ansible.builtin.file:
    path: "{{ nextcloud_path }}/data/{{ nextcloud_homelab_user }}/files/{{ playbook_runner_backup_location | replace('Nextcloud:', '') }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    mode: "0770"
  when: backup_local | default(false)

- name: Repair playbook-runner Nextcloud backup destination ownership
  ansible.builtin.file:
    path: "{{ nextcloud_path }}/data/{{ nextcloud_homelab_user }}/files/{{ playbook_runner_backup_location | replace('Nextcloud:', '') }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    recurse: true
  when: backup_local | default(false)

- name: Backup playbook-runner script
  ansible.builtin.template:
    src: backup_playbook_runner.sh.j2
    dest: /usr/local/bin/backup_playbook_runner.sh
    owner: root
    group: root
    mode: "0700"

- name: Backup playbook-runner daily
  ansible.builtin.cron:
    name: Backup playbook-runner
    special_time: daily
    job: /usr/bin/bash /usr/local/bin/backup_playbook_runner.sh

- name: Start playbook-runner
  ansible.builtin.systemd:
    name: playbook_runner.service
    state: started
  when: not (apply_runtime_changes_on_reboot | default(false) | bool)
