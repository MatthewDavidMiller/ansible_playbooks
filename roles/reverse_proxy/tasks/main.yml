---
- name: Validate reverse proxy management controls
  ansible.builtin.assert:
    that:
      - management_network | length > 0
      - ip_ansible | homelab_valid_ipv4_cidr
      - secret_env_dir | homelab_safe_absolute_path
      - traefik_path | homelab_safe_absolute_path
      - traefik_image | homelab_immutable_digest_ref
      - traefik_dashboard_basic_auth_users | length > 0
      - traefik_dashboard_basic_auth_users | difference(['']) | length == traefik_dashboard_basic_auth_users | length
    fail_msg: "Set management_network, ip_ansible, and traefik_dashboard_basic_auth_users before exposing Traefik."

- name: Validate management_network CIDRs
  ansible.builtin.assert:
    that:
      - item | homelab_valid_ipv4_cidr
    fail_msg: "Each management_network entry must be a valid CIDR and not 0.0.0.0/0."
  loop: "{{ management_network }}"

- name: Validate Traefik dashboard BasicAuth user format
  ansible.builtin.assert:
    that:
      - item is match('^[^:]+:.+')
    fail_msg: "Each traefik_dashboard_basic_auth_users entry must be formatted as user:hashed-password."
  loop: "{{ traefik_dashboard_basic_auth_users }}"

- name: Validate reverse proxy route definitions
  ansible.builtin.assert:
    that:
      - config_name.name is match('^[A-Za-z0-9_-]+$')
      - config_name.proxy_fqdn | length > 0
      - config_name.proxy_upstream_protocol in ['http', 'https']
      - config_name.proxy_upstream_port is match('^[0-9]{1,5}$')
      - (config_name.proxy_upstream_port | int) > 0
      - (config_name.proxy_upstream_port | int) <= 65535
      - config_name.container_destination | length > 0
      - config_name.proxy_network is defined
      - config_name.proxy_network | homelab_safe_name
      - config_name.proxy_network not in reverse_proxy_forbidden_networks
      - config_name.proxy_network in route_proxy_container_ips
    fail_msg: "Each proxy_config entry needs a safe name, FQDN, http/https upstream, valid port, container destination, and route_proxy_container_ips entry."
  loop: "{{ proxy_config }}"
  loop_control:
    loop_var: config_name
  vars:
    reverse_proxy_forbidden_networks:
      - nextcloud_container_net

- name: Validate reverse proxy route names are unique
  ansible.builtin.assert:
    that:
      - proxy_config | map(attribute='name') | list | unique | length == proxy_config | length
      - proxy_config | map(attribute='proxy_fqdn') | list | unique | length == proxy_config | length
      - traefik_dashboard_fqdn not in (proxy_config | map(attribute='proxy_fqdn') | list)
    fail_msg: "proxy_config route names and FQDNs must be unique."

- name: Build Traefik app network list
  ansible.builtin.set_fact:
    traefik_app_networks: "{{ proxy_config | map(attribute='proxy_network') | list | unique }}"

- name: Validate deterministic Traefik route network addresses
  ansible.builtin.assert:
    that:
      - route_proxy_traefik_ips[route_proxy_network_name] is defined
      - route_proxy_traefik_ips[route_proxy_network_name] | homelab_container_assignable_ip(route_proxy_network_subnets[route_proxy_network_name])
      - route_proxy_container_ips[route_proxy_network_name] | homelab_container_assignable_ip(route_proxy_network_subnets[route_proxy_network_name])
      - route_proxy_traefik_ips[route_proxy_network_name] != route_proxy_container_ips[route_proxy_network_name]
    fail_msg: >-
      Every route network with a deterministic subnet needs a route_proxy_traefik_ips
      entry inside that subnet that differs from route_proxy_container_ips. Without
      one, Podman assigns Traefik the first free address, which is the address the
      service container requests.
  loop: "{{ traefik_app_networks | select('in', route_proxy_network_subnets | list) | list }}"
  loop_control:
    loop_var: route_proxy_network_name

- name: Validate Traefik egress network
  ansible.builtin.assert:
    that:
      - traefik_egress_network | homelab_safe_name
      - traefik_egress_network not in traefik_app_networks
      - traefik_egress_network != 'nextcloud_container_net'
    fail_msg: "traefik_egress_network must be a safe dedicated non-backend network name."

- name: Reconcile Traefik egress network
  ansible.builtin.include_role:
    name: container_network
  vars:
    container_network_name: "{{ traefik_egress_network }}"
    container_network_internal: false

- name: Reconcile route proxy networks
  ansible.builtin.include_role:
    name: container_network
  vars:
    container_network_name: "{{ route_proxy_network_name }}"
    container_network_subnet: "{{ route_proxy_network_subnets[route_proxy_network_name] | default('') }}"
    # Control-plane networks are created here when missing so routes resolve on
    # a first run, but their replacement stays with the role that owns the
    # service. Replacing playbook_runner_container_net from here would cut the
    # playbook-runner container that is running the playbook.
    container_network_reconcile_existing: "{{ route_proxy_network_name not in reverse_proxy_deferred_route_networks }}"
  loop: "{{ traefik_app_networks }}"
  loop_control:
    loop_var: route_proxy_network_name

- name: Create traefik container path
  ansible.builtin.file:
    path: "{{ traefik_path }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create traefik config path
  ansible.builtin.file:
    path: "{{ traefik_path }}/config"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create reverse proxy secret directory
  ansible.builtin.file:
    path: "{{ secret_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Traefik env file
  ansible.builtin.template:
    src: traefik.env.j2
    dest: "{{ secret_env_dir }}/traefik.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Initialize acme.json
  ansible.builtin.copy:
    content: ""
    dest: "{{ traefik_path }}/acme.json"
    owner: root
    group: root
    mode: "0600"
    force: false

- name: Traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_path }}/traefik.yml"
    owner: root
    group: root
    mode: "0640"

- name: Traefik TLS options
  ansible.builtin.template:
    src: tls.yml.j2
    dest: "{{ traefik_path }}/config/tls.yml"
    owner: root
    group: root
    mode: "0640"

- name: Traefik security middlewares
  ansible.builtin.template:
    src: security.yml.j2
    dest: "{{ traefik_path }}/config/security.yml"
    owner: root
    group: root
    mode: "0640"

- name: Traefik dashboard router
  ansible.builtin.template:
    src: dashboard.yml.j2
    dest: "{{ traefik_path }}/config/dashboard.yml"
    owner: root
    group: root
    mode: "0640"

- name: Traefik service proxy configs
  ansible.builtin.template:
    src: service_proxy.yml.j2
    dest: "{{ traefik_path }}/config/{{ config_name.name }}.yml"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ proxy_config }}"
  loop_control:
    loop_var: config_name

- name: Traefik service unit
  ansible.builtin.template:
    src: traefik_container.service.j2
    dest: /etc/systemd/system/traefik_container.service
    owner: root
    group: root
    mode: "0644"

- name: Enable Traefik
  ansible.builtin.systemd:
    name: traefik_container.service
    enabled: true
    daemon_reload: true

- name: Traefik launch script
  ansible.builtin.template:
    src: traefik_container.sh.j2
    dest: /usr/local/bin/traefik_container.sh
    owner: root
    group: root
    mode: "0700"

- name: Start Traefik
  ansible.builtin.systemd:
    name: traefik_container.service
    state: started
  when: not (apply_runtime_changes_on_reboot | default(false) | bool)
