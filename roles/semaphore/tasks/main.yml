---
- name: Validate Semaphore secret inputs
  ansible.builtin.assert:
    that:
      - semaphore_encryption_key | length >= 32
      - semaphore_admin_password | length > 0
      - semaphore_db_password | length > 0
      - secret_env_dir | homelab_safe_absolute_path
      - semaphore_image | homelab_immutable_digest_ref
      - route_proxy_network_subnets.semaphore_container_net | homelab_valid_ipv4_cidr
      - container_static_ips.semaphore_proxy | homelab_container_assignable_ip(route_proxy_network_subnets.semaphore_container_net)
      - semaphore_egress_network | homelab_safe_name
      - semaphore_known_hosts | trim | length > 0
      - semaphore_admin_email is match('^[^@\\s]+@[^@\\s]+[.][^@\\s]+$')
      - not (backup_local | bool) or nextcloud_path | homelab_safe_absolute_path
      - not (backup_local | bool) or nextcloud_homelab_user | homelab_safe_name
    fail_msg: Configure strong Semaphore secrets, pinned SSH hosts, safe paths, an immutable image, and valid networks.
  no_log: true

- name: Reconcile Semaphore proxy network
  ansible.builtin.include_role:
    name: container_network
  vars:
    container_network_name: semaphore_container_net
    container_network_subnet: "{{ route_proxy_network_subnets.semaphore_container_net }}"

- name: Validate Semaphore egress network
  ansible.builtin.assert:
    that:
      - semaphore_egress_network | homelab_safe_name
      - semaphore_egress_network != 'nextcloud_container_net'
      - semaphore_egress_network != 'semaphore_container_net'
    fail_msg: "semaphore_egress_network must be a safe dedicated non-backend network name."

- name: Reconcile Semaphore egress network
  ansible.builtin.include_role:
    name: container_network
  vars:
    container_network_name: "{{ semaphore_egress_network }}"
    container_network_internal: false

- name: Create semaphore secret directory
  ansible.builtin.file:
    path: "{{ secret_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create semaphore config directory
  ansible.builtin.file:
    path: /etc/semaphore
    state: directory
    owner: "1001"
    group: root
    mode: "0750"

- name: Create semaphore state directory
  ansible.builtin.file:
    path: /var/lib/semaphore
    state: directory
    owner: "1001"
    group: root
    mode: "0750"

- name: Semaphore env file
  ansible.builtin.template:
    src: semaphore.env.j2
    dest: "{{ secret_env_dir }}/semaphore.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Semaphore known hosts file
  ansible.builtin.template:
    src: ssh_known_hosts.j2
    dest: /etc/semaphore/ssh_known_hosts
    owner: "1001"
    group: root
    mode: "0600"

- name: Semaphore service
  ansible.builtin.template:
    src: semaphore.service.j2
    dest: /etc/systemd/system/semaphore.service
    owner: root
    group: root
    mode: "0644"

- name: Enable semaphore
  ansible.builtin.systemd:
    name: semaphore.service
    enabled: true
    daemon_reload: true

- name: Semaphore script
  ansible.builtin.template:
    src: semaphore.sh.j2
    dest: /usr/local/bin/semaphore.sh
    owner: root
    group: root
    mode: "0700"

- name: Create Semaphore Nextcloud backup destination
  ansible.builtin.file:
    path: "{{ nextcloud_path }}/data/{{ nextcloud_homelab_user }}/files/{{ semaphore_backup_location | replace('Nextcloud:', '') }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    mode: "0770"
  when: backup_local | default(false)

- name: Repair Semaphore Nextcloud backup destination ownership
  ansible.builtin.file:
    path: "{{ nextcloud_path }}/data/{{ nextcloud_homelab_user }}/files/{{ semaphore_backup_location | replace('Nextcloud:', '') }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    recurse: true
  when: backup_local | default(false)

- name: Backup Semaphore DB Script
  ansible.builtin.template:
    src: backup_semaphore.sh.j2
    dest: /usr/local/bin/backup_semaphore.sh
    owner: root
    group: root
    mode: "0700"

- name: Backup Semaphore Daily
  ansible.builtin.cron:
    name: Backup Semaphore
    special_time: daily
    job: /usr/bin/bash /usr/local/bin/backup_semaphore.sh

- name: Start semaphore
  ansible.builtin.systemd:
    name: semaphore.service
    state: started
  when: not (apply_runtime_changes_on_reboot | default(false) | bool)
