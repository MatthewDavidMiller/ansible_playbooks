---
- name: Validate firewalld ingress inputs
  ansible.builtin.assert:
    that:
      - default_interface | length > 0
      - management_network | length > 0
      - ip_ansible | homelab_valid_ipv4_cidr
    fail_msg: "Set default_interface, management_network, and ip_ansible before applying firewall policy."

- name: Validate management_network CIDRs
  ansible.builtin.assert:
    that:
      - item | homelab_valid_ipv4_cidr
    fail_msg: "Each management_network entry must be a valid CIDR and not 0.0.0.0/0."
  loop: "{{ management_network }}"

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Enable firewalld
  ansible.builtin.systemd:
    name: firewalld.service
    enabled: true

- name: Start firewalld
  ansible.builtin.systemd:
    name: firewalld.service
    state: started
  when: not (apply_runtime_changes_on_reboot | default(false) | bool)

- name: Set default action for public to drop
  ansible.posix.firewalld:
    zone: public
    target: DROP
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: present

- name: Create new zone and set it to drop
  ansible.posix.firewalld:
    zone: homelab
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: present

- name: Set zone to drop
  ansible.posix.firewalld:
    zone: homelab
    target: DROP
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: present

- name: Read permanent homelab sources while staging offline changes
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-offline-cmd
      - --zone=homelab
      - --list-sources
  register: standard_firewalld_offline_homelab_sources
  check_mode: false
  changed_when: false
  when: apply_runtime_changes_on_reboot | default(false) | bool

- name: Read permanent homelab sources from running firewalld
  ansible.builtin.command:
    argv:
      - /usr/bin/firewall-cmd
      - --permanent
      - --zone=homelab
      - --list-sources
  register: standard_firewalld_online_homelab_sources
  check_mode: false
  changed_when: false
  when: not (apply_runtime_changes_on_reboot | default(false) | bool)

- name: Select current permanent homelab sources
  ansible.builtin.set_fact:
    standard_firewalld_homelab_sources: >-
      {{ (standard_firewalld_offline_homelab_sources.stdout
          if apply_runtime_changes_on_reboot | default(false) | bool
          else standard_firewalld_online_homelab_sources.stdout).split() }}

- name: Remove stale homelab source assignments
  ansible.posix.firewalld:
    zone: homelab
    source: "{{ stale_source }}"
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: disabled
  loop: >-
    {{ standard_firewalld_homelab_sources
       | difference((management_network + [ip_ansible]) | unique) }}
  loop_control:
    loop_var: stale_source

- name: Set management source for zone
  ansible.posix.firewalld:
    zone: homelab
    source: "{{ mgmt_net }}"
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: enabled
  loop: "{{ management_network }}"
  loop_control:
    loop_var: mgmt_net

- name: Set ansible source for zone
  ansible.posix.firewalld:
    zone: homelab
    source: "{{ ip_ansible }}"
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: enabled

- name: Enable icmp block inversion
  ansible.posix.firewalld:
    zone: homelab
    icmp_block_inversion: true
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: enabled

- name: Allow SSH
  ansible.posix.firewalld:
    zone: homelab
    service: ssh
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: enabled

- name: Allow icmp
  ansible.posix.firewalld:
    zone: homelab
    icmp_block: echo-request
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: enabled

- name: Disable SSH in default zone
  ansible.posix.firewalld:
    zone: public
    service: ssh
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: disabled

- name: Disable SSH in default zone 2
  ansible.posix.firewalld:
    zone: public
    port: 22/tcp
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: disabled

- name: Disable cockpit in default zone
  ansible.posix.firewalld:
    zone: public
    service: cockpit
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: disabled

- name: Disable dhcpv6-client in default zone
  ansible.posix.firewalld:
    zone: public
    service: dhcpv6-client
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: disabled

- name: Disable mdns in default zone
  ansible.posix.firewalld:
    zone: public
    service: mdns
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: disabled

- name: Set interface for public zone
  ansible.posix.firewalld:
    zone: public
    interface: "{{ default_interface }}"
    permanent: true
    immediate: "{{ not (apply_runtime_changes_on_reboot | default(false) | bool) }}"
    state: enabled

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: not (apply_runtime_changes_on_reboot | default(false) | bool)
