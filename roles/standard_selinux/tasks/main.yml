---
- name: Install SELinux management utilities
  ansible.builtin.dnf:
    name:
      - policycoreutils-python-utils
      - setroubleshoot-server
    state: present

- name: Ensure SELinux is enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

- name: Allow containers to manage cgroups (Podman + systemd)
  ansible.posix.seboolean:
    name: container_manage_cgroup
    state: true
    persistent: true

- name: Apply host-specific SELinux booleans
  ansible.posix.seboolean:
    name: "{{ item.name }}"
    state: "{{ item.state | default(true) }}"
    persistent: "{{ item.persistent | default(true) }}"
  loop: "{{ standard_selinux_extra_booleans }}"

- name: Apply host-specific SELinux file contexts
  community.general.sefcontext:
    target: "{{ item.target }}"
    setype: "{{ item.setype }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ standard_selinux_extra_fcontexts }}"
  register: standard_selinux_extra_fcontext_changes

- name: Restore host-specific SELinux file contexts
  ansible.builtin.command: "restorecon -RFv {{ item.item.restore_path | default(item.item.target) }}"
  changed_when: item.changed
  loop: "{{ standard_selinux_extra_fcontext_changes.results }}"
  when: item.changed

- name: Check installed SELinux modules
  ansible.builtin.command: semodule -l
  register: semodule_list
  check_mode: false
  changed_when: false

- name: Install Podman BPF SELinux policy from private temporary files
  when: semodule_list.stdout_lines | select('match', '^podman_bpf(\\s|$)') | list | length == 0
  block:
    - name: Create private SELinux policy build directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible-podman-bpf-
      register: standard_selinux_policy_tmp
      check_mode: false

    - name: Write Podman BPF SELinux policy source
      ansible.builtin.copy:
        dest: "{{ standard_selinux_policy_tmp.path }}/podman_bpf.te"
        content: |
          module podman_bpf 1.0;
          require {
              type init_t;
              type container_runtime_t;
              class bpf { prog_run };
          }
          allow init_t container_runtime_t:bpf { prog_run };
        owner: root
        group: root
        mode: "0600"

    - name: Compile Podman BPF SELinux policy
      ansible.builtin.command:
        argv:
          - /usr/bin/checkmodule
          - -M
          - -m
          - -o
          - "{{ standard_selinux_policy_tmp.path }}/podman_bpf.mod"
          - "{{ standard_selinux_policy_tmp.path }}/podman_bpf.te"
      changed_when: false

    - name: Package Podman BPF SELinux policy
      ansible.builtin.command:
        argv:
          - /usr/bin/semodule_package
          - -o
          - "{{ standard_selinux_policy_tmp.path }}/podman_bpf.pp"
          - -m
          - "{{ standard_selinux_policy_tmp.path }}/podman_bpf.mod"
      changed_when: false

    - name: Install Podman BPF SELinux policy
      ansible.builtin.command:
        argv:
          - /usr/sbin/semodule
          - -i
          - "{{ standard_selinux_policy_tmp.path }}/podman_bpf.pp"
      changed_when: true
  always:
    - name: Remove private SELinux policy build directory
      ansible.builtin.file:
        path: "{{ standard_selinux_policy_tmp.path | default('') }}"
        state: absent
      when: standard_selinux_policy_tmp.path | default('') | length > 0
      check_mode: false
