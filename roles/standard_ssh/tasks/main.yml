---
- name: Validate SSH hardening inputs
  ansible.builtin.assert:
    that:
      - standard_ssh_tcp_forwarding_mode in ['no', 'local', 'remote', 'yes']
      - standard_ssh_streamlocal_forwarding_mode in ['no', 'local', 'remote', 'yes']
      - standard_ssh_max_sessions | int >= 1
      - standard_ssh_max_sessions | int <= 100
      - standard_ssh_allow_users | length > 0
      - standard_ssh_allow_users | select('match', '^[A-Za-z_][A-Za-z0-9_.-]*$') | list | length == standard_ssh_allow_users | length
    fail_msg: "Set a non-empty safe SSH user allowlist and valid forwarding/session limits."

- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy standard ssh hardening drop-in
  ansible.builtin.template:
    src: 10-standard-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-standard-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd

- name: Validate sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
