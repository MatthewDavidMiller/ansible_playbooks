---
# standard_update_packages role defaults

# Apply every available update from the enabled Rocky repositories on each
# run. OS packages are not pinned; the weekly playbook-runner schedule of
# update_homelab_vms.yml is the patch cadence, and it reboots afterwards.
# Set false only to skip patching on a one-off run.
standard_update_apply_full_updates: true

# Enable EPEL only when a maintained workflow explicitly requires it.
# When true, the role also enables CRB (CodeReady Builder); many EPEL packages
# depend on CRB provides and fail depsolve without it.
standard_update_enable_epel: false
