---
- name: Validate Vaultwarden inputs before changing the host
  ansible.builtin.assert:
    that:
      - not (vaultwarden_signups_allowed | bool)
      - vaultwarden_path | homelab_safe_absolute_path
      - vaultwarden_image | homelab_immutable_digest_ref
      - route_proxy_network_subnets.vaultwarden_container_net | homelab_valid_ipv4_cidr
      - container_static_ips.vaultwarden_proxy | homelab_container_assignable_ip(route_proxy_network_subnets.vaultwarden_container_net)
      - not (backup_local | bool) or nextcloud_path | homelab_safe_absolute_path
      - not (backup_local | bool) or nextcloud_homelab_user | homelab_safe_name
    fail_msg: Configure hardened signup policy, safe paths, an immutable image, and a valid Vaultwarden network.

- name: Install sqlite3
  ansible.builtin.dnf:
    name: sqlite
    state: present

- name: Reconcile Vaultwarden proxy network
  ansible.builtin.include_role:
    name: container_network
  vars:
    container_network_name: vaultwarden_container_net
    container_network_subnet: "{{ route_proxy_network_subnets.vaultwarden_container_net }}"

- name: Create Vaultwarden container path
  ansible.builtin.file:
    path: "{{ vaultwarden_path }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create Vaultwarden container data path
  ansible.builtin.file:
    path: "{{ vaultwarden_path }}/vw-data"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create Vaultwarden container ssl certs path
  ansible.builtin.file:
    path: "{{ vaultwarden_path }}/ssl_certs"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create Vaultwarden backups path
  ansible.builtin.file:
    path: "{{ vaultwarden_path }}/database_backups"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create Vaultwarden Nextcloud backup destination
  ansible.builtin.file:
    path: "{{ nextcloud_path }}/data/{{ nextcloud_homelab_user }}/files/{{ vaultwarden_backup_location | replace('Nextcloud:', '') }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    mode: "0770"
  when: backup_local | default(false)

# Ownership only. A recursive mode would also apply the directory mode to the
# backup files themselves; file modes belong to the nextcloud role's
# user-files normalization.
- name: Repair Vaultwarden Nextcloud backup destination ownership
  ansible.builtin.file:
    path: "{{ nextcloud_path }}/data/{{ nextcloud_homelab_user }}/files/{{ vaultwarden_backup_location | replace('Nextcloud:', '') }}"
    state: directory
    owner: "{{ nextcloud_uid }}"
    group: "{{ nextcloud_gid }}"
    recurse: true
  when: backup_local | default(false)

- name: Vaultwarden Service
  ansible.builtin.template:
    src: vaultwarden.service.j2
    dest: /etc/systemd/system/vaultwarden.service
    owner: root
    group: root
    mode: "0644"

- name: Enable Vaultwarden
  ansible.builtin.systemd:
    name: vaultwarden.service
    enabled: true
    daemon_reload: true

- name: Backup Database Script
  ansible.builtin.template:
    src: backup_db.j2
    dest: /usr/local/bin/backup_vaultwarden_db.sh
    owner: root
    group: root
    mode: "0700"

- name: Backup Vaultwarden Daily
  ansible.builtin.cron:
    name: Backup Vaultwarden
    special_time: daily
    job: /usr/bin/bash /usr/local/bin/backup_vaultwarden_db.sh

- name: Vaultwarden script
  ansible.builtin.template:
    src: vaultwarden.sh.j2
    dest: /usr/local/bin/vaultwarden.sh
    owner: root
    group: root
    mode: "0700"

- name: Start Vaultwarden
  ansible.builtin.systemd:
    name: vaultwarden.service
    state: started
  when: not (apply_runtime_changes_on_reboot | default(false) | bool)
