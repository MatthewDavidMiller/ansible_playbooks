---
# VM1's health and logs, for reading from playbook-runner instead of over SSH.
# It changes nothing. The runner has no argument field, so a template picks
# what to show with tags:
#
#   (no tags)     the overview, then every service
#   overview      services, disk, memory, and failed units only
#   network       the overview, then whether VM1 and Traefik can resolve names
#   backups       the overview, then the backup jobs: their schedule, which
#                 are running now and for how long, Borg's locks, and the end
#                 of each backup log
#   <service>     the overview, then that service: traefik, postgres, redis,
#                 nextcloud, paperless, vaultwarden, playbook_runner,
#                 music_server, homedrive
- name: Show VM1's health and service logs
  hosts: vm1
  gather_facts: false
  vars:
    show_logs_lines: 60
    show_logs_since: 24h
    show_logs_backup_lines: 15
  tasks:
    - name: Read the overview
      ansible.builtin.shell: |
        echo "== up since"; uptime -s
        echo "== failed units"; systemctl --failed --no-legend --no-pager
        echo "== containers"
        podman ps --all
        echo "== disks"; df -h -x tmpfs -x devtmpfs -x overlay
        echo "== memory"; free -h
      register: show_logs_overview
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [always, overview]

    - name: Show the overview
      ansible.builtin.debug:
        msg: "{{ show_logs_overview.stdout_lines + show_logs_overview.stderr_lines }}"
      tags: [always, overview]

    # Traefik needs public DNS to reach Let's Encrypt. Each nameserver is tried
    # on its own because a container's list comes in a different order at each
    # start, so one bad entry fails only some of the time.
    - name: Read DNS from VM1 and from Traefik
      ansible.builtin.shell: |
        name=acme-v02.api.letsencrypt.org
        echo "== VM1 looks up $name"
        getent hosts "$name" || echo "no answer"
        echo "== VM1 resolv.conf"; cat /etc/resolv.conf
        echo "== Traefik resolv.conf"; podman exec traefik cat /etc/resolv.conf
        echo "== Traefik looks up $name through each nameserver"
        for server in $(podman exec traefik cat /etc/resolv.conf | awk '/^nameserver/{print $2}'); do
          echo "-- $server"
          timeout 8 podman exec traefik nslookup "$name" "$server" 2>&1 | tail -n 3 \
            || true
        done
        echo "== firewalld"; firewall-cmd --get-active-zones
        echo "== Podman networking"; rpm -q netavark aardvark-dns
        podman info | grep -E 'networkBackend:'
        echo "== Traefik DNS timeouts in the last hour"
        timeouts=$(journalctl --no-pager --output=short-iso --since=-1h \
          CONTAINER_NAME=traefik | grep 'i/o timeout')
        printf '%s' "$timeouts" | grep -c '' || true
        printf '%s\n' "$timeouts" | tail -n 1
      register: show_logs_network
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [network]

    - name: Show DNS from VM1 and from Traefik
      ansible.builtin.debug:
        msg: "{{ show_logs_network.stdout_lines + show_logs_network.stderr_lines }}"
      tags: [network]

    - name: Traefik
      ansible.builtin.import_tasks: standalone_tasks/show_service_logs.yml
      vars: {show_logs_container: traefik, show_logs_unit: traefik_container}
      tags: [traefik]

    - name: PostgreSQL
      ansible.builtin.import_tasks: standalone_tasks/show_service_logs.yml
      vars: {show_logs_container: postgres, show_logs_unit: postgres_container}
      tags: [postgres]

    - name: Redis
      ansible.builtin.import_tasks: standalone_tasks/show_service_logs.yml
      vars: {show_logs_container: redis, show_logs_unit: redis_container}
      tags: [redis]

    - name: Nextcloud
      ansible.builtin.import_tasks: standalone_tasks/show_service_logs.yml
      vars: {show_logs_container: nextcloud, show_logs_unit: nextcloud_container}
      tags: [nextcloud]

    - name: Paperless
      ansible.builtin.import_tasks: standalone_tasks/show_service_logs.yml
      vars: {show_logs_container: paperless, show_logs_unit: paperless_ngx}
      tags: [paperless]

    - name: Vaultwarden
      ansible.builtin.import_tasks: standalone_tasks/show_service_logs.yml
      vars: {show_logs_container: vaultwarden, show_logs_unit: vaultwarden}
      tags: [vaultwarden]

    - name: Playbook-runner
      ansible.builtin.import_tasks: standalone_tasks/show_service_logs.yml
      vars: {show_logs_container: playbook_runner, show_logs_unit: playbook_runner}
      tags: [playbook_runner]

    - name: Music-server
      ansible.builtin.import_tasks: standalone_tasks/show_service_logs.yml
      vars: {show_logs_container: music_server, show_logs_unit: music_server}
      tags: [music_server]

    - name: Homedrive
      ansible.builtin.import_tasks: standalone_tasks/show_service_logs.yml
      vars: {show_logs_container: homedrive, show_logs_unit: homedrive}
      tags: [homedrive]

    # Whether a backup is working or stuck: what runs it, what is running
    # now, who holds each Borg repository's lock (a job waits up to an hour
    # for it), and what each job last said.
    - name: Read the backups
      ansible.builtin.shell: |
        echo "== the backup jobs in root's crontab"
        crontab -l -u root 2>/dev/null | grep -E 'backup|borg' || echo "none"
        echo "== running now (elapsed time, [[days-]hours:]minutes:seconds)"
        ps -eo pid,etime,args --sort=start_time \
          | grep -E '[b]ackup_[a-z_]+\.sh|[h]omedrive_restore_drill|[b]org (create|prune|compact|check|extract|init)|[r]clone (sync|copy)|[h]d-server (import|prune|checkpoint)' \
          || echo "nothing"
        echo "== Borg locks"
        for repo in {{ ([borg_backup_path | default('/borg_backups'),
                         nextcloud_borg_backup_path | default('/data_drive/nextcloud/borg_backup'),
                         homedrive_borg_repo | default('')] | select | unique | map('quote') | join(' ')) }}; do
          [ -f "$repo/config" ] || continue
          if [ -d "$repo/lock.exclusive" ]; then
            echo "$repo is locked by $(ls "$repo/lock.exclusive")"
          else
            echo "$repo is not locked"
          fi
        done
        echo "== the end of each backup log"
        for log in /var/log/vaultwarden_backup.log /var/log/playbook_runner_backup.log \
                   /var/log/music_server_backup.log /var/log/borg-backup.log \
                   /var/log/rclone-nextcloud-borg.log /var/log/homedrive_backup.log \
                   /var/log/homedrive_drill.log; do
          [ -e "$log" ] || continue
          echo "-- $log, last written $(date -r "$log" --iso-8601=seconds)"
          tail -n {{ show_logs_backup_lines }} "$log"
        done
      args:
        executable: /bin/bash
      register: show_logs_backups
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [backups]

    - name: Show the backups
      ansible.builtin.debug:
        msg: "{{ show_logs_backups.stdout_lines + show_logs_backups.stderr_lines }}"
      tags: [backups]
