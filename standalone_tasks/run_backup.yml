---
# One backup, for run_backups.yml: runs the script root's crontab runs every
# night, now, if that crontab schedules it (a backup that is not set up on
# this host has no entry, and is passed over). A job no cron entry starts
# (run_backup_scheduled_by: installed, the restore drill) runs if its script
# is installed, which happens only where it is set up. A lock keeps two manual runs
# of one backup apart. The script's own output and the end of its log are
# shown, and the result is kept for the play's summary.
- name: Check {{ run_backup_name }} is set up
  ansible.builtin.shell:
    cmd: >-
      {% if run_backup_scheduled_by | default('cron') == 'installed' %}
      test -x {{ run_backup_script | quote }}
      {% else %}
      set -o pipefail && crontab -l -u root 2>/dev/null | grep -qF -- {{ run_backup_script | quote }}
      {% endif %}
    executable: /bin/bash
  register: run_backup_scheduled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Run the {{ run_backup_name }} backup
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      out="$(mktemp)"
      status=0
      /usr/bin/flock --nonblock --conflict-exit-code 75 /run/lock/run_backups_{{ run_backup_name }}.lock \
        /usr/bin/bash {{ run_backup_script | quote }} {{ run_backup_args | default('') }} > "$out" 2>&1 || status=$?
      [ "$status" -eq 75 ] && echo "another manual run of this backup is still going"
      tail -n 40 "$out"
      rm -f "$out"
      {% if run_backup_log | length > 0 %}
      echo "== the end of {{ run_backup_log }}"
      tail -n 20 {{ run_backup_log | quote }} 2>/dev/null || true
      {% endif %}
      exit "$status"
    executable: /bin/bash
  register: run_backup_result
  failed_when: false
  when: run_backup_scheduled.rc == 0

- name: Show the {{ run_backup_name }} backup
  ansible.builtin.debug:
    msg: >-
      {{ (run_backup_result.stdout_lines | default([]) + run_backup_result.stderr_lines | default([]))
         if run_backup_scheduled.rc == 0
         else ['not set up on this host; passed over'] }}

- name: Record the {{ run_backup_name }} backup
  ansible.builtin.set_fact:
    run_backups_results: >-
      {{ run_backups_results | default({}) | combine({run_backup_name:
           ('not set up' if run_backup_scheduled.rc != 0
            else 'skipped (check mode)' if run_backup_result.skipped | default(false)
            else 'ok' if run_backup_result.rc == 0
            else 'FAILED (exit ' ~ run_backup_result.rc ~ ')')}) }}
